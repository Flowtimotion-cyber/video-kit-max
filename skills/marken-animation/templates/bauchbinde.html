<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Bauchbinde {{NAME}}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root { --w:{{BREITE}}px; --h:{{HOEHE}}px; --p:{{FARBE_PRIMAER}}; --s:{{FARBE_SEKUNDAER}}; --ink:{{FARBE_TEXT}}; --hell:{{FARBE_HELL}};
         --u: calc(var(--w) / 100); }
  html, body { margin:0; background:{{HINTERGRUND}}; }
  /* Hintergrund „transparent“ (Standard) oder z. B. #00FF00 für Greenscreen, siehe SKILL.md Abschnitt Bauchbinde */
  #root { position:relative; width:var(--w); height:var(--h); overflow:hidden; background:{{HINTERGRUND}}; font-family:"{{SCHRIFT_FLIESSTEXT}}", sans-serif; }
  .bb { position:absolute; left:6%; bottom:12%; display:flex; align-items:stretch; }
  .kante { width:calc(var(--u) * 1.1); background:var(--s); transform:scaleY(0); transform-origin:bottom; }
  .box { background:var(--p); color:var(--hell); padding:calc(var(--u) * 1.6) calc(var(--u) * 3) calc(var(--u) * 1.6) calc(var(--u) * 2.4);
         clip-path:inset(0 100% 0 0); }
  .name { font-family:"{{SCHRIFT_UEBERSCHRIFT}}", serif; font-size:calc(var(--u) * 3.6); font-weight:700; line-height:1.1; }
  .rolle { font-size:calc(var(--u) * 2.2); line-height:1.3; opacity:.9; margin-top:calc(var(--u) * .5); }
</style>
</head>
<body>
<div id="root" data-composition-id="{{ID}}" data-start="0" data-width="{{BREITE}}" data-height="{{HOEHE}}" data-duration="{{DAUER}}">
  <div class="bb">
    <div class="kante" id="kante"></div>
    <div class="box" id="box">
      <div class="name">{{NAME}}</div>
      <div class="rolle">{{ROLLE}}</div>
    </div>
  </div>
</div>
<script>
  const D = {{DAUER}};
  const tl = gsap.timeline({ paused: true });
  tl.to("#kante", { scaleY: 1, duration: .35, ease: "power3.out" }, 0)
    .to("#box", { clipPath: "inset(0 0% 0 0)", duration: .55, ease: "power3.out" }, .2)
    .to("#box", { clipPath: "inset(0 100% 0 0)", duration: .45, ease: "power3.in" }, D - .75)
    .to("#kante", { scaleY: 0, duration: .3, ease: "power3.in" }, D - .35);
  window.__timelines = window.__timelines || {};
  window.__timelines["{{ID}}"] = tl;
</script>
</body>
</html>
